name: Deploy G-12MATH to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - '.nojekyll'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package.json

      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Build web app
        working-directory: apps/web
        env:
          VITE_POCKETBASE_URL: ${{ vars.VITE_POCKETBASE_URL }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_NAME: Grade 12 Math Academy
          VITE_ENVIRONMENT: production
        run: npm run build

      - name: Sync built app to repository root
        run: |
          rm -rf ./assets
          cp -R ./dist/apps/web/. ./
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets .nojekyll
          if git diff --cached --quiet; then
            echo "No generated site changes to commit."
          else
            git commit -m "[skip ci] Sync G-12MATH web build"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/apps/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
